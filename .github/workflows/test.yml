name: Test if statement
on:
  push:
    branches:
      - development
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
jobs:
  docker:
    name: Testing labels
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'build-containers' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4